<!-- Ambient Music Player -->
<div class="music-player">
  <button id="music-toggle">🎵 Play Calm Music</button>
  <audio id="ambient-music" loop>
    <source src="beautiful-stress-relief-ambient-184569.mp3" type="audio/mpeg">
    Your browser does not support the audio tag.
  </audio>
</div>

<script>
const music = document.getElementById("ambient-music");
const toggle = document.getElementById("music-toggle");
let isPlaying = false;

toggle.addEventListener("click", () => {
  if (isPlaying) {
    music.pause();
    toggle.textContent = "🎵 Play Calm Music";
  } else {
    music.play();
    toggle.textContent = "⏸ Pause Music";
  }
  isPlaying = !isPlaying;
});

 // Fetch users from backend
    fetch('/getUsers')
      .then(res => res.json())
      .then(users => {
        const userList = document.getElementById('userList');

        if (users.length === 0) {
          userList.textContent = 'No users found in the database.';
          return;
        }

        userList.innerHTML = users.map(user => `
          <div class="user">
            <strong>Name:</strong> ${user.name} <br>
            <strong>Age:</strong> ${user.age}
          </div>
        `).join('');
      })
      .catch(err => {
        console.error(err);
        document.getElementById('userList').textContent = 'Error loading users.';
      });
</script>
